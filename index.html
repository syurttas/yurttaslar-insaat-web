  <meta name="description" content="Ankara ve çevresinde inşaat, dekorasyon, peyzaj, ferforje ve bahçe düzenleme hizmetleri.">
  
  <style>
    /* Temel Stil Tanımlamaları */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #2d3748; line-height: 1.6; background-color: #fff; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; object-fit: cover; }
    
    /* Üst Bilgi Çubuğu */
    .top-bar { background: #1a202c; color: #cbd5e0; font-size: 0.875rem; padding: 8px 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    
    /* Header & Navigasyon */

    nav a:hover { color: #3182ce; }
    
    .dropdown { position: relative; display: inline-block; }

    .dropdown-content a:hover { background-color: #ebf8ff; color: #2b6cb0; font-weight: 600; }
    .dropdown:hover .dropdown-content { display: block; }

    .btn-quote { background: #2b6cb0; color: #fff; padding: 8px 18px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; transition: background 0.2s; }

    .hero-content { max-width: 800px; margin: 0 auto; }

    .hero-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: #3182ce; color: white; padding: 12px 24px; border-radius: 6px; font-weight: 600; }

    .service-card-body a { color: #3182ce; font-weight: 600; }

    .contact-info p { color: #a0aec0; margin-bottom: 25px; }
    .info-item { margin-bottom: 20px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }

    .btn-submit:hover { background: #2c5282; }
